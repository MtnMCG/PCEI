[project]
name = "pcei_framework"
version = "0.1.0"
description = "Physically Constrained Emergent Intelligence Framework"
authors = [
    {name = "Emerson", email = "emerson@example.com"}
]
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "tiktoken>=0.6.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "pillow>=10.2.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
