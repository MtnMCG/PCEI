name: Publish Cross-Platform Packages & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-release-and-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with Mac, Windows, and Linux Downloads
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "PCEI 750M Desktop Edition (${{ github.ref_name }})"
          body: |
            ## PCEI 750M Standalone Desktop Packages (Mac, Windows, Linux)
            Pre-configured with **Temperature `0.5`**, **Top-p `0.9`**, **Repetition Penalty `1.05`**, and **Multi-Turn Conversation History (`ON`)**.
            Automatically uses or downloads `pcei_750m_competitive_best.pt` from Hugging Face (`MtnMCG/PCEI-Text`).

            ### Individual Platform Downloads
            - **macOS (`.dmg` Disk Image)**: `PCEI_750M_Mac.dmg` (or `run_mac.command`)
            - **Windows (`.exe` & `.zip`)**: `PCEI_Chat_Windows.exe` / `PCEI_750M_Windows.zip`
            - **Linux (`.tar.gz` & `.sh`)**: `PCEI_750M_Linux.tar.gz` / `run_linux.sh`
          files: |
            packages/releases/PCEI_750M_Mac.dmg
            packages/releases/PCEI_750M_Windows.zip
            packages/releases/PCEI_750M_Linux.tar.gz
            packages/pcei_desktop/PCEI_Chat_Windows.exe
            packages/pcei_desktop/run_mac.command
            packages/pcei_desktop/run_linux.sh
            packages/pcei_desktop/run_windows.bat

      - name: Log in to GitHub Container/Package Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Individual Mac, Windows, and Linux Packages to GitHub Packages Tab
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for PLATFORM in mac windows linux; do
            WORK=$(mktemp -d)
            cp -r packages/pcei_desktop/* "$WORK/"
            cp packages/releases/* "$WORK/" 2>/dev/null || true
            cat <<EOF > "$WORK/Dockerfile"
          FROM python:3.11-slim
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.description="PCEI 750M Standalone Desktop Package (${PLATFORM}) - Temp 0.5, Multi-Turn History"
          WORKDIR /pcei
          COPY . /pcei/
          CMD ["python3", "chat.py", "--temperature", "0.5"]
          EOF
            docker build -t "ghcr.io/${OWNER}/pcei-750m-${PLATFORM}:latest" -t "ghcr.io/${OWNER}/pcei-750m-${PLATFORM}:v0.2.2" "$WORK"
            docker push "ghcr.io/${OWNER}/pcei-750m-${PLATFORM}:latest"
            docker push "ghcr.io/${OWNER}/pcei-750m-${PLATFORM}:v0.2.2"
          done
